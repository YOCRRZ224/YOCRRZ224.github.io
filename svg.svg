
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="64" height="64">

  <defs>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#92945D"/>
      <stop offset="1" stop-color="#555B37"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D0B875"/>
      <stop offset="1" stop-color="#927941"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="15" fill="#0C0C0E"/>

  <!-- Pulsar beams -->
  <g stroke="#B49A58" stroke-width="1.5"
     stroke-linecap="round" opacity=".8">
    <path d="M32 5 L32 13"/>
    <path d="M32 51 L32 59"/>
    <path d="M8 32 L15 32"/>
    <path d="M49 32 L56 32"/>
  </g>

  <!-- Outer orbital ring -->
  <ellipse cx="32" cy="32" rx="27" ry="10"
           transform="rotate(-28 32 32)"
           fill="none" stroke="url(#gold)"
           stroke-width="2.5"/>

  <!-- Planet -->
  <circle cx="32" cy="32" r="13"
          fill="url(#planet)"/>

  <!-- Planet shading -->
  <path d="M32 19
           A13 13 0 0 1 32 45
           A9 13 0 0 0 32 19"
        fill="#343A29" opacity=".7"/>

  <!-- Y monogram -->
  <g fill="none" stroke="#D0B875"
     stroke-width="2.8"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M25 25 L32 32 L39 25"/>
    <path d="M32 32 L32 40"/>
  </g>

  <!-- Front section of orbital ring -->
  <path d="M8 37
           C17 46 43 43 55 26"
        fill="none" stroke="#B49A58"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- Pulsar core -->
  <circle cx="32" cy="32" r="2"
          fill="#E0C986"/>

</svg>
